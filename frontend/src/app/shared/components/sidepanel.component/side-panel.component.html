@if (open()) {
  <div
    class="side-panel"
    animate.enter="side-panel-enter"
    animate.leave="side-panel-leave"
  >
    <button
      class="side-panel__backdrop"
      type="button"
      aria-label="Cerrar panel"
      (click)="cerrar()"
    ></button>

    <aside
      class="side-panel__container"
      role="dialog"
      aria-modal="true"
      aria-label="Panel lateral"
      tabindex="-1"
      cdkTrapFocus
      [cdkTrapFocusAutoCapture]="true"
      (keydown.escape)="cerrar()"
    >
      <header class="side-panel__header">
        <ng-content select="app-side-panel-header" />
      </header>

      <section class="side-panel__content">
        <ng-content select="app-side-panel-content" />
      </section>

      <footer class="side-panel__footer">
        <ng-content select="app-side-panel-footer" />
      </footer>
    </aside>
  </div>
}
