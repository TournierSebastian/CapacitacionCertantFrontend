<select
  class="select"
  [value]="value()"
  [disabled]="disabled()"
  [attr.aria-label]="ariaLabel()"
  (change)="onSelectChange($event)"
>
  <option value="">{{ placeholder() }}</option>

  @for (option of options(); track option.value) {
    <option [value]="option.value" [selected]="option.value === value()">
      {{ option.label }}
    </option>
  }
</select>
