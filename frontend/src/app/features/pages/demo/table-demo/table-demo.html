<section class="table-demo">
	<h1>Tabla de ejemplo</h1>
	<app-table>
		<app-table-head>
			<app-table-row>
				<app-table-header-cell>ID</app-table-header-cell>
				<app-table-header-cell>Caso</app-table-header-cell>
				<app-table-header-cell>Estado</app-table-header-cell>
				<app-table-header-cell>Prioridad</app-table-header-cell>
				<app-table-header-cell>Responsable</app-table-header-cell>
				<app-table-header-cell>Fecha</app-table-header-cell>
			</app-table-row>
		</app-table-head>
		<app-table-body>
			@for (caso of casos; track caso.id) {
				<app-table-row>
					<app-table-cell>#{{ caso.id }}</app-table-cell>
					<app-table-cell>{{ caso.titulo }}</app-table-cell>
					<app-table-cell><app-badgecomponent>{{ caso.estado }}</app-badgecomponent></app-table-cell>
					<app-table-cell>{{ caso.prioridad }}</app-table-cell>
					<app-table-cell>{{ caso.responsableNombre }}</app-table-cell>
					<app-table-cell>{{ caso.fechaCreacion }}</app-table-cell>
				</app-table-row>
			}
		</app-table-body>
	</app-table>
</section>
