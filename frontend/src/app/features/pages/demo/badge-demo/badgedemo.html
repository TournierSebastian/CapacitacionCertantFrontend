<section class="badge-demo">
  <h2>Demo de Badge</h2>

    <h3>Colores</h3>

    <app-badgecomponent color="green">Verde</app-badgecomponent>
    <app-badgecomponent color="blue">Azul</app-badgecomponent>
    <app-badgecomponent color="gray">Gris</app-badgecomponent>
    <app-badgecomponent color="red">Rojo</app-badgecomponent>
    <app-badgecomponent color="yellow">Amarillo</app-badgecomponent>

    <h3>Con fondo y borde</h3>

    <app-badgecomponent color="green" [shadow]="true">
      Cerrado
    </app-badgecomponent>

    <app-badgecomponent color="blue" [shadow]="true">
      En progreso
    </app-badgecomponent>

    <app-badgecomponent color="gray" [shadow]="true">
      Baja
    </app-badgecomponent>

    <app-badgecomponent color="red" [shadow]="true">
      Alta
    </app-badgecomponent>

    <app-badgecomponent color="yellow" [shadow]="true">
      Abierto
    </app-badgecomponent>
 

</section>
