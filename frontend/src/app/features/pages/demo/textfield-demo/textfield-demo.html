<section class="demo">

  <header class="demo__header">
    <h1>Textfield</h1>
    <p>Campo de texto reutilizable con distintos usos.</p>
  </header>

  <form [formGroup]="formulario">

    <div class="demo__field">
      <label class="demo__label">
        Nombre
      </label>

      <app-textfield
        formControlName="nombre"
        placeholder="Ingresá tu nombre"
        label="Nombre"
      />

      <p class="demo__value">
        Valor:
        {{ formulario.controls.nombre.value || 'Sin completar' }}
      </p>
    </div>

    <div class="demo__field">
      <label class="demo__label">
        Buscar casos
      </label>

      <app-textfield
        formControlName="busqueda"
        icon="⌕"
        type="search"
        placeholder="Buscar por caso, responsable o ID..."
        label="Buscar casos"
      />

      <p class="demo__value">
        Búsqueda:
        {{ formulario.controls.busqueda.value || 'Sin búsqueda' }}
      </p>
    </div>

    <div class="demo__field">
      <label class="demo__label">
        Email
      </label>

      <app-textfield
        formControlName="email"
        icon="✉"
        type="email"
        placeholder="nombre@correo.com"
        label="Email"
      />

      <p class="demo__value">
        Email:
        {{ formulario.controls.email.value || 'Sin completar' }}
      </p>
    </div>

    <button
      class="demo__button"
      type="button"
      (click)="limpiar()"
    >
      Limpiar campos
    </button>

  </form>

</section>
